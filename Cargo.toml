[workspace]
members = [
    "crates/crucible-fuzzer",
    "crates/crucible-test-context",
    "crates/crucible-fuzz-macro",
    "crates/crucible-fuzz-runtime",
    "crates/crucible-invariant-macro",
    "crates/crucible-macro-utils",
    "crates/crucible-idl-gen",
    "crates/crucible-fuzz-cli",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
litesvm = { version = "0.12", features = ["register-tracing"] }
anchor-lang = "1.0.2"
anchor-spl = { version = "1.0.2", features = ["token_2022"] }
# Solana crates aligned to litesvm 0.12 / solana-instruction 3.4 (pubkey 4.x line),
# matching the stack roshi-tests already runs. Most are ^3.0 ranges that resolve
# to the latest 3.x; only pubkey crosses a major (3 -> 4).
solana-pubkey = "4.2"
solana-keypair = "3.0"
solana-signer = "3.0"
solana-signature = "3.0"
solana-account = "3.0"
solana-transaction = "3.0"
solana-message = "3.0"
solana-hash = "3.0"
solana-program-runtime = "3.0"
solana-transaction-context = "3.0"
solana-transaction-error = "3.0"
solana-clock = "3.0"
solana-sbpf = "0.13"
solana-compute-budget = "3.0"
solana-bpf-loader-program = "3.0"
solana-rpc-client = "3.0"
solana-rpc-client-api = "3.0"

spl-token = "9.0"
bytemuck = { version = "1.14", features = ["derive"] }
once_cell = "1.19"

[workspace.lints]
rust.missing_debug_implementations = "warn"
rust.unreachable_pub = "warn"
rust.unused_must_use = "deny"
clippy.wildcard_imports = "deny"
